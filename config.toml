# The Simpsons Arcade Game (NPUB30563) — ps3recomp configuration
#
# Used by: python tools/recompile.py --config config.toml
# Modeled on flow/config.toml; module list will be trimmed once NIDs are resolved.

[input]
elf_path = "game/EBOOT.elf"     # produced by decrypting USRDIR/EBOOT.BIN
sfo_path = "extracted/PARAM.SFO"

[output]
output_dir = "src/recomp/"
func_prefix = "recomp_"
generate_func_table = true

[modules]
# Actual import set parsed from the EBOOT sys_proc_prx_param lib.stub tables:
# 20 libraries, 256 functions. (See imports.json / docs/emulator-architecture.md.)
# "hle" = use ps3recomp host implementation. Core path = graphics/audio/input/fs.
cellGcmSys     = "hle"   # 22 — RSX: emulator framebuffer -> GPU
cellAudio      = "hle"   # 12 — emulated sound chips -> PCM out
sys_io         = "hle"   #  5 — cellPad input
sys_fs         = "hle"   # 15 — loads SIMPSONS.SR / SIMPSONS_FW.SR
cellSysutil    = "hle"   # 19 — system params, video out, callbacks
cellSysmodule  = "hle"   #  2 — module load/unload
sysPrxForUser  = "hle"   # 20 — TLS, lwmutex, threads, process exit
cellGame       = "hle"   #  5 — content/boot path
cellRtc        = "hle"   #  2 — clock
cellSpurs      = "hle"   #  9 — SPU task mgmt (likely incidental for the core)
# --- front-end media: stub initially, wire later for movies/music ---
cellSail       = "stub"  # 28 — video playback (attract/intro movie)
cellAtrac      = "stub"  #  8 — ATRAC3 audio decode
# --- online / PSN: stub for offline single-machine play ---
sceNp          = "stub"  # 37
sceNp2         = "stub"  # 27
sceNpTrophy    = "stub"  # 13 — trophies (NPWR01444_00)
sceNpCommerce2 = "stub"  #  2
cellNetCtl     = "stub"  #  6
sys_net        = "stub"  # 14
cellUserInfo   = "stub"  #  1
cellSysutilAvc2 = "stub" #  9 — voice chat

[memory]
main_ram_mb = 256
vram_mb = 256
thread_stack_kb = 1024

[threading]
max_ppu_threads = 64
max_spu_threads = 6
use_host_threads = true

[graphics]
backend = "d3d12"
width = 1280
height = 720
vsync = "on"
scale_factor = 1

[audio]
backend = "wasapi"
sample_rate = 48000
buffer_size = 512

[debug]
log_hle_calls = true
log_missing_nids = true
break_on_unimplemented = false
dump_disassembly = false
breakpoint_address = 0
